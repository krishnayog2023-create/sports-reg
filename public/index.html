<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Annual Sports Week 2026-27</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 600px; width: 100%; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { margin-top: 0; font-size: 1.6rem; color: #38bdf8; text-align: center; }
    p.subtitle { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #cbd5e1; }
    input, select { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; font-size: 0.95rem; }
    input:focus, select:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 8px; }
    button:hover { background: #0369a1; }
    .success-card { background: #064e3b; border: 1px solid #059669; padding: 16px; border-radius: 8px; text-align: center; display: none; margin-top: 16px; }
    .code { font-size: 1.8rem; font-weight: bold; letter-spacing: 2px; color: #34d399; margin: 10px 0; }
    .member-box { background: #0f172a; padding: 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #334155; }
    .error-msg { background: #7f1d1d; color: #fca5a5; padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Annual Sports Week 2026-27</h1>
    <p class="subtitle">Official Unified Registration Portal</p>

    <div id="errorAlert" class="error-msg"></div>

    <form id="regForm">
      <div class="form-group">
        <label>Select Sport *</label>
        <select id="sport" required>
          <option value="">-- Choose Sport --</option>
          <option value="Box Cricket">Box Cricket (Team - 10 players)</option>
          <option value="Table Tennis">Table Tennis (Individual)</option>
          <option value="Carrom">Carrom (Individual)</option>
          <option value="Volleyball">Volleyball (Team - 8 players)</option>
          <option value="Kabaddi">Kabaddi (Team)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Participant Type *</label>
        <select id="participant_type" required>
          <option value="Student">Student</option>
          <option value="Staff">Staff</option>
        </select>
      </div>

      <div class="form-group" id="staffTypeGroup" style="display: none;">
        <label>Staff Category *</label>
        <select id="staff_type">
          <option value="Teaching">Teaching Staff</option>
          <option value="Non-Teaching">Non-Teaching Staff</option>
        </select>
      </div>

      <div class="form-group" id="teamNameGroup" style="display: none;">
        <label>Team Name *</label>
        <input type="text" id="team_name" placeholder="Enter Team Name" />
      </div>

      <div id="dynamicRoster"></div>

      <button type="submit">Submit Registration</button>
    </form>

    <div class="success-card" id="successCard">
      <h3>Registration Confirmed! 🎉</h3>
      <p>Your unique registration code:</p>
      <div class="code" id="displayCode">------</div>
      <p style="font-size: 0.8rem; color: #a7f3d0;">Save this code for event verification.</p>
    </div>
  </div>

  <script>
    const sportSelect = document.getElementById('sport');
    const participantTypeSelect = document.getElementById('participant_type');
    const staffTypeGroup = document.getElementById('staffTypeGroup');
    const teamNameGroup = document.getElementById('teamNameGroup');
    const dynamicRoster = document.getElementById('dynamicRoster');
    const regForm = document.getElementById('regForm');
    const errorAlert = document.getElementById('errorAlert');

    function renderFormFields() {
      const sport = sportSelect.value;
      const isTeam = ['Box Cricket', 'Volleyball', 'Kabaddi'].includes(sport);
      
      teamNameGroup.style.display = isTeam ? 'block' : 'none';
      staffTypeGroup.style.display = participantTypeSelect.value === 'Staff' ? 'block' : 'none';

      dynamicRoster.innerHTML = '';
      let count = isTeam ? (sport === 'Box Cricket' ? 10 : (sport === 'Volleyball' ? 8 : 6)) : 1;

      for (let i = 0; i < count; i++) {
        let labelText = isTeam ? `Player ${i + 1} Details` : `Participant Details`;
        div = document.createElement('div');
        div.className = 'member-box';
        div.innerHTML = `
          <strong>${labelText}</strong>
          <div class="form-group" style="margin-top:8px;">
            <label>Full Name *</label>
            <input type="text" class="m-name" required placeholder="Full Name">
          </div>
          <div class="form-group">
            <label>Primary Code (Exact 5 digits) *</label>
            <input type="text" class="m-code" maxlength="5" required placeholder="e.g. 10001">
          </div>
          <div class="form-group">
            <label>Gender *</label>
            <select class="m-gender" required>
              <option value="Boy">Boy / Male</option>
              <option value="Girl">Girl / Female</option>
            </select>
          </div>
        `;
        dynamicRoster.appendChild(div);
      }
    }

    sportSelect.addEventListener('change', renderFormFields);
    participantTypeSelect.addEventListener('change', renderFormFields);

    regForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';

      const sport = sportSelect.value;
      const participantType = participantTypeSelect.value;
      const staffType = document.getElementById('staff_type').value;
      const teamName = document.getElementById('team_name').value;

      const memberBoxes = document.querySelectorAll('.member-box');
      const members = [];

      for (let box of memberBoxes) {
        const name = box.querySelector('.m-name').value.trim();
        const primaryCode = box.querySelector('.m-code').value.trim();
        const gender = box.querySelector('.m-gender').value;

        if (!/^\d{5}$/.test(primaryCode)) {
          errorAlert.innerText = `Validation Error: Primary Code "${primaryCode}" must be exactly 5 digits.`;
          errorAlert.style.display = 'block';
          return;
        }
        members.push({ name, primary_code: primaryCode, gender });
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sport,
            category: memberBoxes.length > 1 ? 'Team' : 'Individual',
            team_name: teamName,
            participant_type: participantType,
            staff_type: staffType,
            members
          })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          regForm.style.display = 'none';
          document.getElementById('displayCode').innerText = data.reg_code;
          document.getElementById('successCard').style.display = 'block';
        } else {
          errorAlert.innerText = data.error || 'Submission failed.';
          errorAlert.style.display = 'block';
        }
      } catch (err) {
        errorAlert.innerText = 'Server connection error.';
        errorAlert.style.display = 'block';
      }
    });
  </script>
</body>
</html>
