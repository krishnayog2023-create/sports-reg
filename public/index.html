<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annual Sports Week 2026-27 - Registration Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #111b27; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1a2634; padding: 30px; border-radius: 10px; width: 100%; max-width: 500px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #4facfe; margin-bottom: 5px; }
        p { text-align: center; color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        .btn { width: 100%; background: #007bff; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #0056b3; }
        .member-box { background: #0f172a; padding: 12px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #334155; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Annual Sports Week 2026-27</h2>
        <p>Official Unified Registration Portal</p>

        <form id="registrationForm">
            <div class="form-group">
                <label for="sport">Select Sport *</label>
                <select id="sport" name="sport" required onchange="updatePlayerFields()">
                    <option value="">-- Choose Sport --</option>
                    <option value="Table Tennis (Individual)">Table Tennis (Individual)</option>
                    <option value="Carrom">Carrom</option>
                    <option value="Box Cricket">Box Cricket (Min 3 Girls)</option>
                    <option value="Volleyball">Volleyball (Min 3 Girls)</option>
                    <option value="Kabaddi">Kabaddi (7 to 10 Players)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    <option value="Student">Student</option>
                    <option value="Team">Team</option>
                </select>
            </div>

            <div class="form-group">
                <label for="primary_code">Primary Code (Exact 5 digits or Code) *</label>
                <input type="text" id="primary_code" name="primary_code" placeholder="Enter code" required>
            </div>

            <div id="dynamicParticipantsContainer">
                <!-- Dynamic player inputs will load here -->
            </div>

            <button type="submit" class="btn">Submit Registration</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        function updatePlayerFields() {
            const sport = document.getElementById('sport').value;
            const container = document.getElementById('dynamicParticipantsContainer');
            container.innerHTML = '';

            let minPlayers = 1;
            let maxPlayers = 1;
            let labelText = "Participant Name *";

            const lower = sport.toLowerCase();
            if (lower.includes('kabaddi')) {
                minPlayers = 7;
                maxPlayers = 10;
                labelText = "Kabaddi Squad Member (7 Playing + up to 3 Substitutes)";
            } else if (lower.includes('box cricket') || lower.includes('volleyball')) {
                minPlayers = 6;
                maxPlayers = 11;
                labelText = "Team Member (Min 3 Girls required)";
            } else if (lower.includes('carrom')) {
                minPlayers = 1;
                maxPlayers = 2;
                labelText = "Player Name";
            } else {
                minPlayers = 1;
                maxPlayers = 1;
                labelText = "Full Name *";
            }

            let html = `<label>${labelText} (${minPlayers}${maxPlayers > minPlayers ? ' to ' + maxPlayers : ''}):</label>`;
            
            for (let i = 0; i < minPlayers; i++) {
                html += `
                    <div class="member-box">
                        <input type="text" placeholder="Player ${i + 1} Name *" name="memberName_${i}" required style="margin-bottom: 8px;">
                        <select name="memberGender_${i}" required>
                            <option value="">Select Gender *</option>
                            <option value="Boy">Boy / Male</option>
                            <option value="Girl">Girl / Female</option>
                        </select>
                    </div>
                `;
            }

            // If max > min, add optional extra fields (like substitutes for kabaddi)
            if (maxPlayers > minPlayers) {
                html += `<div style="margin: 10px 0 5px 0; font-size: 13px; color: #94a3b8;">Optional Substitutes / Extra Members:</div>`;
                for (let i = minPlayers; i < maxPlayers; i++) {
                    html += `
                        <div class="member-box" style="border-style: dashed;">
                            <input type="text" placeholder="Substitute ${i + 1} Name (Optional)" name="memberName_${i}" style="margin-bottom: 8px;">
                            <select name="member
